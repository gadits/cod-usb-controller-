name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --stacktrace --no-daemon 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Publish APK (stable download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk CodUsbController.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest CodUsbController.apk \
            --title "גרסה 1.0.${{ github.run_number }}" \
            --notes "להורדה: לחץ על CodUsbController.apk והתקן." \
            --latest

      - name: Save build log on failure
        if: failure()
        run: |
          cp "$RUNNER_TEMP/build.log" /tmp/full.log 2>/dev/null || echo "no log" > /tmp/full.log
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-logs
          git rm -rf --cached . > /dev/null
          tail -c 300000 /tmp/full.log > ci-build.log
          git add -f ci-build.log
          git commit -m "build log run ${{ github.run_number }}"
          git push -f origin ci-logs
