name: Build, test on emulator, publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --stacktrace --no-daemon 2>&1 | tee "$RUNNER_TEMP/build.log"
          cp app/build/outputs/apk/standard/release/app-standard-release.apk CodUsbController.apk
          cp app/build/outputs/apk/auto/release/app-auto-release.apk AutoCodUsb.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            CodUsbController.apk
            AutoCodUsb.apk

      - name: Save build log on failure
        if: failure()
        run: |
          cp "$RUNNER_TEMP/build.log" /tmp/full.log 2>/dev/null || echo "no log" > /tmp/full.log
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-logs
          git rm -rf --cached . > /dev/null
          tail -c 300000 /tmp/full.log > ci-build.log
          git add -f ci-build.log
          git commit -m "build log run ${{ github.run_number }}"
          git push -f origin ci-logs

  device-test:
    needs: build
    # emulator test runs only when asked for: put [test] in the commit message
    if: ${{ contains(github.event.head_commit.message, '[test]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run end-to-end test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 ci/device_test.py CodUsbController.apk

      - name: Save test results
        if: always()
        run: |
          mkdir -p ci-out
          cp -r ci-out /tmp/ci-out
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-test
          git rm -rf --cached . > /dev/null
          rm -rf ci-out && cp -r /tmp/ci-out ci-out
          git add -f ci-out
          git commit -m "device test run ${{ github.run_number }} (${{ job.status }})"
          git push -f origin ci-test

  publish:
    needs: [build, device-test]
    if: ${{ always() && needs.build.result == 'success' && (needs.device-test.result == 'success' || needs.device-test.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Publish release (stable download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest CodUsbController.apk AutoCodUsb.apk \
            --title "גרסה 1.0.${{ github.run_number }}" \
            --notes "CodUsbController.apk – הרגילה | AutoCodUsb.apk – Auto COD USB" \
            --latest

      - name: Update second download link
        run: |
          mkdir /tmp/dl && cp CodUsbController.apk AutoCodUsb.apk /tmp/dl/
          cd /tmp/dl
          git init -q -b download
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add CodUsbController.apk AutoCodUsb.apk
          git commit -q -m "APK 1.0.${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" download
