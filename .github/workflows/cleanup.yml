name: Release cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove Auto COD USB from older releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for tag in $(gh release list --limit 100 --json tagName --jq '.[].tagName'); do
            gh release delete-asset "$tag" AutoCodUsb.apk --yes 2>/dev/null && echo "removed from $tag" || true
          done
